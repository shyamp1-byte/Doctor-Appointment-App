<!DOCTYPE html>
<html>
<head>
    <title>Data Table Example</title>
    <style>
        table {
            border-collapse: collapse;
            align-content: center;
            text-align: center;
        }
        th, td {
            padding: 8px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Data Table Example</h1>
    <div style="align-content: center;">
    <table id="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Country</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
</div>

    <script src="script.js"></script>
</body>
</html>
